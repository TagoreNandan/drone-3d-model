services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: gcs-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcs
      POSTGRES_PASSWORD: gcs
      POSTGRES_DB: gcs
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data:
